<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">
    <h1>Diario de Estudio</h1>

    <section class="streak-card">
      <div class="streak-hero">
        <p class="streak-label">Racha actual</p>
        <p class="streak-value"><span id="streakCount">0</span></p>
      </div>
      <dl class="stats">
        <div class="stat">
          <dt>Mejor racha</dt>
          <dd><span id="bestStreakCount">0</span></dd>
        </div>
        <div class="stat">
          <dt>Esta semana</dt>
          <dd><span id="weekMinutes">0</span></dd>
        </div>
        <div class="stat">
          <dt>Este mes</dt>
          <dd><span id="monthDays">0</span></dd>
        </div>
      </dl>
    </section>

    <section class="goal-card" aria-labelledby="goalTitle">
      <h2 id="goalTitle">Objetivo semanal</h2>
      <p id="goalProgress" class="goal-progress" aria-live="polite">0 minutos · Sin objetivo · Fija uno</p>
      <div id="goalBar" class="goal-bar">
        <div id="goalFill" class="goal-fill" aria-hidden="true"></div>
      </div>
      <p id="goalDone" class="goal-done hidden">¡Objetivo cumplido!</p>
      <form id="goalForm" novalidate>
        <div class="form-group">
          <label for="goalInput">Minutos por semana</label>
          <input type="number" id="goalInput" min="1" step="1" inputmode="numeric" required>
        </div>
        <button type="submit" class="btn-save">Guardar objetivo</button>
      </form>
    </section>

    <section class="heat-card">
      <h2>Últimas 12 semanas</h2>
      <div id="heatmap" class="heatmap" role="group" aria-label="Días estudiados de las últimas 12 semanas"></div>
      <p id="heatmapDetail" class="heat-detail" aria-live="polite"></p>
      <div class="heat-legend" role="list" aria-label="Minutos estudiados al día, de menos a más">
        <span class="heat-legend-item" role="listitem"><i class="heat-swatch level-0" aria-hidden="true"></i>sin estudio (0 min)</span>
        <span class="heat-legend-item" role="listitem"><i class="heat-swatch level-1" aria-hidden="true"></i>1–29 min</span>
        <span class="heat-legend-item" role="listitem"><i class="heat-swatch level-2" aria-hidden="true"></i>30–59 min</span>
        <span class="heat-legend-item" role="listitem"><i class="heat-swatch level-3" aria-hidden="true"></i>60–119 min</span>
        <span class="heat-legend-item" role="listitem"><i class="heat-swatch level-4" aria-hidden="true"></i>≥120 min</span>
      </div>
    </section>

    <section class="form-card">
      <h2>Nueva sesión</h2>
      <form id="sessionForm" novalidate>
        <div class="form-group">
          <label for="dateInput">Fecha</label>
          <input type="date" id="dateInput" required>
        </div>

        <div class="form-group">
          <label for="topicInput">Tema</label>
          <input type="text" id="topicInput" placeholder="Ej. Repaso de HTML" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="minutesInput">Minutos</label>
          <input type="number" id="minutesInput" placeholder="Ej. 25" min="1" step="1" inputmode="numeric"
            required>
        </div>

        <button type="submit" class="btn-save">Guardar sesión</button>
      </form>
    </section>

    <section class="list-card">
      <h2>Mis sesiones</h2>
      <ul id="sessionsList" class="sessions-list"></ul>
      <p id="emptyState" class="empty-state">Aún no hay sesiones registradas.</p>
    </section>
  </main>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>

</html>
